<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Human+AI Pilot Chat</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#f7f7f8; color:#1f2328; }
    .wrap { max-width:780px; margin:0 auto; padding:18px; }
    .card { background:white; border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.05); }
    .head { padding:16px 18px; border-bottom:1px solid #eee; }
    .head h1 { font-size:18px; margin:0 0 5px; }
    .head p { margin:0; font-size:13px; color:#667085; }
    #messages { min-height:300px; max-height:520px; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .msg { padding:11px 13px; border-radius:14px; white-space:pre-wrap; line-height:1.45; max-width:88%; }
    .user { align-self:flex-end; background:#111827; color:white; }
    .assistant { align-self:flex-start; background:#f1f3f5; }
    .composer { padding:14px; border-top:1px solid #eee; display:grid; grid-template-columns:1fr auto; gap:10px; }
    textarea { resize:vertical; min-height:70px; max-height:180px; border:1px solid #d0d5dd; border-radius:12px; padding:12px; font:inherit; }
    button { border:0; border-radius:12px; padding:0 18px; background:#111827; color:white; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .note { font-size:12px; color:#667085; padding:0 16px 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <h1>AI Assistant</h1>
        <p>Use this chat for the current pilot scenario. Do not enter passwords, banking, health, or other sensitive data.</p>
      </div>
      <div id="messages"></div>
      <div class="composer">
        <textarea id="input" placeholder="Write your question to the AI…"></textarea>
        <button id="send">Send</button>
      </div>
      <div class="note">Your question and the AI answer can later be passed back into the pilot form automatically.</div>
    </div>
  </div>

<script>
const messages = [];
const box = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");

function add(role, content) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = content;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

async function submit() {
  const message = input.value.trim();
  if (!message) return;
  add("user", message);
  input.value = "";
  send.disabled = true;

  try {
    const params = new URLSearchParams(location.search);
    const r = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message,
        history:messages,
        participantCode:params.get("participant") || "",
        phase:params.get("phase") || ""
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    add("assistant", data.text);
    messages.push({role:"user", content:message}, {role:"assistant", content:data.text});

    // Allows a parent page (e.g. a wrapper around Tally) to capture the exchange.
    window.parent?.postMessage({
      type:"human-ai-pilot-chat",
      message,
      answer:data.text
    }, "*");
  } catch (e) {
    add("assistant", "The AI could not be reached. Please try again.");
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener("click", submit);
input.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submit();
});
</script>
</body>
</html>
